# render.yaml — One-click Render Blueprint for SherByte v6.
#
# This blueprint runs the API container on Render and points it at YOUR
# existing Supabase Postgres (pgvector). Render only provisions the API and a
# free Redis/Key-Value store; the database stays in Supabase.
#
# How to get a live link:
#   1. Push this branch (done).
#   2. In Supabase ➜ Project Settings ➜ Database ➜ Connection string, copy the
#      *Transaction pooler* URI (host: aws-0-<region>.pooler.supabase.com,
#      port 6543, user: postgres.<project-ref>). Use the POOLER, not the direct
#      connection — Render's free tier is IPv4-only and the pooler is the IPv4
#      endpoint. Append ?sslmode=require if it isn't already present.
#   3. On render.com: New ➜ Blueprint ➜ connect this repo ➜ select this branch.
#   4. Render reads this file. When prompted, paste the Supabase URI into
#      DATABASE_URL (it's marked sync:false so it's never committed to git).
#   5. Click "Apply". In ~3-5 min you get https://sherrbyte-api.onrender.com.
#      The app auto-runs its migrations on boot (creates the `vector` +
#      `pgcrypto` extensions and all tables) against your Supabase database.
#
# AI keys are OPTIONAL — leave them blank and the app runs rule-based + hash
# embeddings. Add GEMINI_API_KEY later in the dashboard for real summaries.

services:
  - type: web
    name: sherrbyte-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false             # paste your Supabase *transaction pooler* URI
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sherrbyte-kv
          property: connectionString
      - key: ENV
        value: prod
      # The origin the og:url, the canonical link and every sitemap entry are
      # written against. Wrong here means every link preview and every indexed
      # URL points at a host that is not this one, so it is declared rather
      # than defaulted.
      - key: SITE_URL
        sync: false
      - key: RUN_SCHEDULER
        value: "true"          # single free service owns ingestion
      - key: LOG_LEVEL
        value: INFO
      # Which imagery policy the app serves. Declared rather than left to a
      # default, because main.py and image_service.py each carried their own and
      # a silent disagreement decides what every card looks like.
      #   stock     — Pexels, no third-party exposure (needs PEXELS_API_KEY)
      #   thumbnail — the publisher's image, size-capped and credited
      #   art       — generated category art only
      # `stock` is the default: hotlinking the publisher's own image is bandwidth
      # theft and a copyright exposure. Set PEXELS_API_KEY or stock falls back to
      # generated art (never a publisher hotlink).
      - key: IMAGE_MODE
        value: stock
      - key: PEXELS_API_KEY
        sync: false            # set in the dashboard; enables dynamic stock imagery
      - key: ADMIN_TOKEN
        generateValue: true    # /admin/* is refused entirely without it in prod
      - key: JWT_SECRET
        generateValue: true
      - key: WATERMARK_SECRET
        generateValue: true
      # Optional: supabase-py client (auth/storage helpers). The app's own JWT
      # auth works without these; set them only if you use Supabase Auth/Storage.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Token for /cron/collect. Point an external scheduler (cron-job.org or
      # UptimeRobot, every 15 min) at
      #   https://sherrbyte-api.onrender.com/cron/collect?token=<CRON_TOKEN>
      # A free instance sleeps when idle and a sleeping process runs no jobs —
      # this is what keeps the news cycle running when nobody has the app open.
      - key: CRON_TOKEN
        generateValue: true
      # Password-reset emails. Render's free tier blocks outbound SMTP, so the
      # HTTPS Resend API is used (free: 3,000/month). Without a key the
      # "Forgot password?" flow answers 503 rather than pretending to send.
      # MAIL_FROM must be an address on a domain verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false             # e.g. SherrByte <no-reply@sherrbyte.com>
      - key: GEMINI_API_KEY
        sync: false             # optional — add in dashboard for real AI
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false

  # ─── Redis / Key-Value (cache + dedup + ARQ queue) ─────────────────────────
  # Supabase has no Redis, so Render provides a free Key-Value store. The app
  # degrades gracefully if it's ever unavailable.
  - type: keyvalue
    name: sherrbyte-kv
    plan: free
    ipAllowList: []            # internal access only
    maxmemoryPolicy: allkeys-lru
