<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060C17">
<title>WorldMonitor</title>
</head>
<body>
<div id="map"></div>
<div id="suntint"></div>

<!-- Loading -->
<div id="gl-load"><div class="gl-orb"></div><div class="gl-txt">Loading the world…</div></div>

<!-- Top bar: hamburger + brand + live badge -->
<header id="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Open menu">
    <svg viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="1" x2="18" y2="1"/><line x1="0" y1="7" x2="18" y2="7"/><line x1="0" y1="13" x2="18" y2="13"/>
    </svg>
  </button>
  <div class="top-brand">
    <div class="brand-dot"></div>
    <span>WorldMonitor</span>
  </div>
  <div class="top-right">
    <span class="live-badge">● LIVE</span>
  </div>
</header>

<!-- Search bar (slides down from top when FAB clicked) -->
<div id="searchWrap">
  <div id="searchbar">
    <svg class="srch-ico" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="M14 14l3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search a city or place…" autocomplete="off" spellcheck="false">
    <button id="homeBtn" title="Go to Anantapur">🏠</button>
  </div>
  <div id="searchResults"></div>
</div>

<!-- Side menu overlay -->
<div id="menuOverlay"></div>

<!-- Left drawer -->
<aside id="sideMenu">
  <div class="menu-header">
    <div class="brand-icon-lg">🌐</div>
    <div class="menu-brand">
      <div class="menu-brand-name">WorldMonitor</div>
      <div class="menu-brand-sub">Geopolitical intelligence</div>
    </div>
    <button id="menuClose" class="icon-btn" aria-label="Close menu">✕</button>
  </div>

  <div class="menu-section">
    <div class="menu-label">DATA LAYERS</div>
    <button id="ciiBtn" class="menu-item" title="Country Instability Index heatmap">
      <span class="menu-ico">🌡️</span>
      <div><div class="menu-item-title">Stability Index</div><div class="menu-item-sub">Country instability heatmap</div></div>
    </button>
    <button id="quakeBtn" class="menu-item" title="Live earthquakes M2.5+">
      <span class="menu-ico">🌍</span>
      <div><div class="menu-item-title">Earthquakes</div><div class="menu-item-sub">USGS · 24h · M2.5+</div></div>
    </button>
  </div>

  <div class="menu-section">
    <div class="menu-label">TIME OF DAY</div>
    <div id="suntime">
      <span id="sunphase">☀️</span>
      <input id="sunslider" type="range" min="0" max="1439" step="5" aria-label="Time of day">
      <span id="sunlabel">12:00</span>
    </div>
  </div>

  <div class="menu-footer">
    <span>WORLDMONITOR · LIVE</span>
  </div>
</aside>

<!-- Time machine — bottom centre -->
<div id="dial" role="group" aria-label="Time machine">
  <button id="bYearBack" title="Back one year">«</button>
  <button id="bMonthBack" title="Back one month">‹ Mo</button>
  <button id="bDayBack" title="Back one day">‹ Day</button>
  <div id="dateLabel"></div>
  <button id="bDayFwd" title="Forward one day">Day ›</button>
  <button id="bMonthFwd" title="Forward one month">Mo ›</button>
  <button id="todayBtn">Today</button>
</div>

<!-- Search FAB — bottom right -->
<button id="searchFab" aria-label="Search">
  <svg viewBox="0 0 20 20" fill="none">
    <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="2.2"/>
    <path d="M14 14l3.5 3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
</button>

<!-- City / data panel -->
<div id="panel" aria-live="polite"></div>

<!-- Footer -->
<footer id="footer">
  <span class="footer-brand">🌐 WORLDMONITOR</span>
  <span class="footer-sub">News · Markets · Flashpoints · Stability</span>
</footer>

<script type="module" src="/src/main.js"></script>
<script>
  /* Side menu */
  const sideMenu   = document.getElementById('sideMenu');
  const menuOverlay= document.getElementById('menuOverlay');
  const open  = () => { sideMenu.classList.add('open'); menuOverlay.classList.add('on'); };
  const close = () => { sideMenu.classList.remove('open'); menuOverlay.classList.remove('on'); };
  document.getElementById('menuBtn').addEventListener('click', open);
  document.getElementById('menuClose').addEventListener('click', close);
  menuOverlay.addEventListener('click', close);

  /* Search FAB */
  const searchFab  = document.getElementById('searchFab');
  const searchWrap = document.getElementById('searchWrap');
  searchFab.addEventListener('click', () => {
    const showing = searchWrap.classList.toggle('open');
    searchFab.classList.toggle('active', showing);
    if (showing) document.getElementById('searchInput').focus();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      searchWrap.classList.remove('open');
      searchFab.classList.remove('active');
      close();
    }
  });
</script>
</body>
</html>
