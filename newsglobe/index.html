<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070D18">
<title>WorldMonitor</title>
</head>
<body>
<div id="map"></div>
<div id="suntint"></div>

<div id="gl-load">
  <div class="gl-orb"></div>
  <div class="gl-txt">Loading the world…</div>
</div>

<!-- Top navigation bar -->
<nav id="topnav">
  <div class="nav-brand">
    <div class="nav-icon">🌐</div>
    <span class="nav-title">WorldMonitor</span>
  </div>

  <div id="searchbar">
    <svg class="srch-ico" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14 14l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search a city…" autocomplete="off" spellcheck="false">
    <button id="homeBtn" title="Go to Anantapur">🏠</button>
  </div>

  <div class="nav-actions">
    <button id="ciiBtn" class="nav-toggle" title="Country Instability Index heatmap">🌡️ <span>Stability</span></button>
    <button id="quakeBtn" class="nav-toggle" title="Live earthquakes (USGS · 24h · M2.5+)">🌍 <span>Quakes</span></button>
  </div>
</nav>

<div id="searchResults"></div>

<!-- Time machine — bottom centre -->
<div id="dial" role="group" aria-label="Time machine">
  <button id="bYearBack" title="Back one year">«</button>
  <button id="bMonthBack" title="Back one month">‹ Mo</button>
  <button id="bDayBack" title="Back one day">‹ Day</button>
  <div id="dateLabel"></div>
  <button id="bDayFwd" title="Forward one day">Day ›</button>
  <button id="bMonthFwd" title="Forward one month">Mo ›</button>
  <button id="todayBtn">Today</button>
</div>

<!-- Sun slider — desktop only -->
<div id="suntime" title="Drag to change time of day">
  <span id="sunphase">☀️</span>
  <input id="sunslider" type="range" min="0" max="1439" step="5" aria-label="Time of day">
  <span id="sunlabel">12:00</span>
</div>

<!-- City / data panel -->
<div id="panel" aria-live="polite"></div>

<!-- Bottom footer -->
<footer id="footer">
  <span class="footer-brand">🌐 WORLDMONITOR</span>
  <span class="footer-sub">Live news · Markets · Flashpoints · Stability</span>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
