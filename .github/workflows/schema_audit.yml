name: schema-audit

# TEMPORARY diagnostic. Runs the read-only scripts/schema_audit.py on every push
# to the schema-unify branch, using the existing DATABASE_URL secret, so the
# public-vs-sherrbyte_app inventory can be read straight from the job log without
# a workflow_dispatch (which would require the workflow to live on main first).
# Read-only: the script only does SELECT/COUNT/MAX. Remove this file once the
# schema is unified.
on:
  push:
    branches: [claude/schema-unify]

concurrency:
  group: schema-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install asyncpg
      - name: Run schema audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/schema_audit.py | tee audit.md
          echo "----- STEP SUMMARY -----"
          cat audit.md >> "$GITHUB_STEP_SUMMARY"
