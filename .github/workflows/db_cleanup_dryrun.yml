name: db-cleanup-dryrun

# EPHEMERAL diagnostic workflow for the Supabase quota cleanup.
#
# On PUSH to the working branch it always runs scripts/db_cleanup.py in DRY-RUN
# (measure + plan only, deletes nothing) so the branch can be re-measured after
# each change.
#
# A manual workflow_dispatch with apply=true runs the DESTRUCTIVE default
# windows: --apply (DELETE old rows + null old embeddings + VACUUM FULL) and
# then, in the same job, an immediate dry-run to report the post-VACUUM sizes.
# apply is false by default, so a dispatch is dry-run unless explicitly asked.
#
# Uses the existing DATABASE_URL secret (the Supabase transaction-pooler URI the
# engine and app share). Delete this file once the cleanup work is done.
on:
  push:
    branches: [claude/vibrant-archimedes-se9lx1]
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete + VACUUM FULL at the default windows (then re-measure). Leave false for dry-run."
        required: false
        default: false
        type: boolean
      probe:
        description: "Read-only: inspect stored info_objects.embedding vectors (hash vs MiniLM)."
        required: false
        default: false
        type: boolean
      purge_embeddings:
        description: "DESTRUCTIVE: NULL every info_objects.embedding and DROP its HNSW index, then re-measure."
        required: false
        default: false
        type: boolean

jobs:
  db-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # db_cleanup.py imports only asyncpg (see requirements.txt), so install
      # just that rather than the full app dependency set.
      - run: pip install asyncpg==0.29.0

      - name: APPLY — delete + null embeddings + VACUUM FULL (default windows)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/db_cleanup.py --apply

      - name: PROBE — inspect stored embedding vectors (read-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/db_cleanup.py --embed-probe

      - name: PURGE EMBEDDINGS — null all + drop HNSW index (DESTRUCTIVE)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.purge_embeddings }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/db_cleanup.py --embed-purge

      # Always runs: on push, and after an --apply dispatch it reports the
      # reclaimed (post-VACUUM) sizes. Never passes --apply, so it only measures.
      # --audit adds the read-only breakdown: every relation > 5 MB split into
      # table/toast/index, large indexes by access method (HNSW visible), the
      # per-column footprint of the app articles table, and embedding cost by age.
      - name: db_cleanup.py — dry-run + audit (measure only, no --apply)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/db_cleanup.py --audit
