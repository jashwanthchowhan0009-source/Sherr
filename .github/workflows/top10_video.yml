name: top10-video

# Renders the daily Top-10 news video from the written, significant stories of
# the last 24h and attaches it to the run as an artifact (Actions → this run →
# Artifacts). Voice is Kokoro on CPU — no API key, no per-video cost.
#
# Required secret: DATABASE_URL (the same pooler URI cron-ingest uses).
on:
  schedule:
    - cron: "15 2 * * *"     # 07:45 IST — the morning briefing
  workflow_dispatch:
    inputs:
      count:
        description: "How many stories"
        default: "10"

concurrency:
  group: top10-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video_studio/requirements.txt
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libsndfile1 fonts-dejavu-core
      - name: Fonts (Inter + Inter Display)
        run: |
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          mkdir -p video_studio/fonts && unzip -q -j -o /tmp/inter.zip "extras/otf/*" -d video_studio/fonts
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/video_studio
          key: kokoro-v1.0
      - run: pip install -r video_studio/requirements.txt
      - name: Make the video
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python -m video_studio.make --count "${{ github.event.inputs.count || 10 }}" --workers 4
          code=$?
          if [ "$code" = "3" ]; then echo "::notice::No eligible written stories in the last 24h — nothing rendered."; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top10-video
          path: |
            out/**/*.mp4
            out/**/captions.srt
            out/**/manifest.json
          if-no-files-found: ignore
          retention-days: 14
