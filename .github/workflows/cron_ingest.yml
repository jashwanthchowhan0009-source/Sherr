name: cron-ingest

# Scheduled ingestion against Supabase, independent of the API host (so the feed
# keeps filling even when a free Render instance is asleep). Ingest runs every
# 15 min; the ALS recommender retrains nightly at 03:00 UTC.
#
# NOTE: GitHub only runs workflows from the repository ROOT (.github/workflows),
# which is why this lives here rather than under sherrbyte/.
#
# Required repo secret: DATABASE_URL (Supabase transaction-pooler URI).
# Optional secrets: REDIS_URL, SUPABASE_URL, SUPABASE_KEY, GEMINI_API_KEY,
# GROQ_API_KEY, NEWSAPI_KEY. Add them in Settings → Secrets and variables → Actions.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min — ingest
    - cron: "0 3 * * *"      # 03:00 UTC   — ALS retrain
  workflow_dispatch: {}

concurrency:
  group: cron-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event.schedule != '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sherrbyte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sherrbyte/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run ingest cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          RUN_SCHEDULER: "false"
        run: python -m app.workers.ingest_worker

  als-retrain:
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sherrbyte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sherrbyte/requirements.txt
      - run: pip install -r requirements.txt
      - name: Retrain ALS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python -m app.workers.als_worker
